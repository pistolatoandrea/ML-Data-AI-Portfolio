version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: crypto_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: crypto_data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - etl_network

  # --- METABASE ---
  metabase:
    image: metabase/metabase:latest
    container_name: crypto_metabase
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase_data:/metabase-data
    networks:
      - etl_network
    depends_on:
      - postgres

volumes:
  postgres_data:
  metabase_data:

networks:
  etl_network: